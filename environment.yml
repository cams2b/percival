name: percival
# --- Optional: Flash Attention 2 for the ModernBERT text tower ---
# `flash-attn` is intentionally NOT listed as a hard dependency: pre-built
# wheels vary by CUDA / driver / torch build, and environments without it
# should still work. When the matching wheel is available, install with:
#   pip install flash-attn --no-build-isolation
# The language tower (foundation/transformer_models/language_tower.py)
# auto-detects flash_attn at import time and falls back to SDPA otherwise.
channels:
  - defaults
dependencies:
  - _libgcc_mutex=0.1=main
  - _openmp_mutex=5.1=1_gnu
  - blas=1.0=mkl
  - bottleneck=1.3.7=py310ha9d4c09_0
  - bzip2=1.0.8=h5eee18b_6
  - ca-certificates=2024.7.2=h06a4308_0
  - et_xmlfile=1.1.0=py310h06a4308_0
  - intel-openmp=2023.1.0=hdb19cb5_46306
  - ld_impl_linux-64=2.38=h1181459_1
  - libffi=3.4.4=h6a678d5_1
  - libgcc-ng=11.2.0=h1234567_1
  - libgomp=11.2.0=h1234567_1
  - libstdcxx-ng=11.2.0=h1234567_1
  - libuuid=1.41.5=h5eee18b_0
  - mkl=2023.1.0=h213fc3f_46344
  - mkl-service=2.4.0=py310h5eee18b_1
  - mkl_fft=1.3.8=py310h5eee18b_0
  - mkl_random=1.2.4=py310hdb19cb5_0
  - ncurses=6.4=h6a678d5_0
  - numexpr=2.8.7=py310h85018f9_0
  - numpy-base=1.26.4=py310hb5e798b_0
  - openpyxl=3.1.5=py310h5eee18b_0
  - openssl=3.0.14=h5eee18b_0
  - pandas=2.2.2=py310h6a678d5_0
  - pip=24.0=py310h06a4308_0
  - python=3.10.14=h955ad1f_1
  - python-dateutil=2.9.0post0=py310h06a4308_2
  - python-tzdata=2023.3=pyhd3eb1b0_0
  - pytz=2024.1=py310h06a4308_0
  - readline=8.2=h5eee18b_0
  - setuptools=72.1.0=py310h06a4308_0
  - six=1.16.0=pyhd3eb1b0_1
  - sqlite=3.45.3=h5eee18b_0
  - tbb=2021.8.0=hdb19cb5_0
  - tk=8.6.14=h39e8969_0
  - tzdata=2024a=h04d1e81_0
  - wheel=0.43.0=py310h06a4308_0
  - xz=5.4.6=h5eee18b_1
  - zlib=1.2.13=h5eee18b_1
  - pip:
      # --------------------------------------------------------------
      # Direct deps that percival_release/ actually imports. These get
      # explicit pins so the public release is reproducible.
      # --------------------------------------------------------------
      - accelerate==1.11.0
      - beartype==0.20.2
      - einops==0.8.0
      - einx==0.3.0
      - matplotlib==3.9.1.post1
      # medrs is the Penn-internal NIfTI loader used when
      # data.load_method: medrs in the training config. Not on PyPI —
      # install from your internal source. Skip this if your config
      # uses data.load_method: monai (MONAI is already pinned below).
      - medrs
      - monai==1.5.1
      - nibabel==5.2.1
      - nltk==3.9.1
      - numpy==1.26.3
      # nvidia-* pins — these MUST match the cluster's `module load cuda/12.9`
      # toolchain. The earlier env shipping torch 2.7+cu128 with bundled
      # NCCL 2.21 hung at `Accelerator()`-time process-group init on
      # cuda/12.9 nodes. anduril (the proven-working env) carries explicit
      # nvidia-nccl-cu12==2.27.5, which is what we mirror here.
      - nvidia-cublas-cu12==12.8.4.1
      - nvidia-cudnn-cu12==9.10.2.21
      - nvidia-nccl-cu12==2.27.5
      - nvidia-ml-py==12.560.30
      - opencv-python==4.10.0.84
      - pillow==10.2.0
      - protobuf==5.29.3
      - pyyaml==6.0.2
      - safetensors==0.4.4
      - scikit-image==0.24.0
      - scipy==1.14.0
      - sentencepiece==0.2.0
      - simpleitk==2.3.1
      - timm==1.0.12
      # CUDA 12.8 wheels of torch 2.9 — required for Blackwell (B200, sm_100)
      # support AND to pull in NCCL 2.27.5 which is compatible with the
      # cluster's `module load cuda/12.9`. Earlier torch 2.7+cu128 shipped
      # NCCL 2.21 and hung at `Accelerator()` process-group init on B200.
      # If you're on a pre-Ampere GPU and only have a CUDA 11.8 driver,
      # downgrade to torch==2.4.0 with the cu118 index.
      - torch==2.9.1
      - torchvision==0.24.1
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - transformers==4.57.1
      # triton is pinned to match torch 2.9 (older torch 2.7 used triton 3.3.x).
      - triton==3.5.1
      # wandb is the default training logger. Set wandb.enabled: false
      # in your training config if you don't want to log to W&B; the
      # trainer will skip the import path entirely.
      - wandb
      # --------------------------------------------------------------
      # Transitive deps (torch / transformers / accelerate / matplotlib
      # / requests / scikit-image / wandb / pydantic all pull these).
      # Intentionally UNPINNED — pip resolves whatever satisfies the
      # direct pins above. Earlier pins repeatedly clashed with newer
      # floors (e.g. torch 2.9 requires sympy>=1.13.3, transformers
      # 4.57 requires huggingface_hub>=0.30, etc.).
      # --------------------------------------------------------------
      # - annotated-types
      # - certifi
      # - charset-normalizer
      # - click
      # - contourpy
      # - cycler
      # - filelock
      # - fonttools
      # - frozendict
      # - fsspec
      # - hjson
      # - huggingface-hub
      # - idna
      # - imageio
      # - jinja2
      # - joblib
      # - kiwisolver
      # - lazy-loader
      # - markupsafe
      # - mpmath
      # - msgpack
      # - networkx
      # - ninja
      # - packaging
      # - psutil
      # - py-cpuinfo
      # - pydantic
      # - pydantic-core
      # - pyparsing
      # - regex
      # - requests
      # - sympy
      # - tifffile
      # - tokenizers
      # - tqdm
      # - typing-extensions
      # - urllib3
      # --------------------------------------------------------------
      # Notes on removed packages:
      # deepspeed — its setup.py imports torch before pip can install
      #   torch, so it fails to build in the same flat pass. Install
      #   AFTER the env is up:  pip install deepspeed==0.16.3
      # vector-quantize-pytorch — not imported by any release module.
